---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: karakeep-secret
    template:
      data:
        NEXTAUTH_SECRET: "{{ .KARAKEEP_NEXTAUTH_SECRET }}"
        MEILI_MASTER_KEY: "{{ .KARAKEEP_MEILI_MASTER_KEY }}"
        OAUTH_CLIENT_ID: "{{ .KARAKEEP_OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .KARAKEEP_OAUTH_CLIENT_SECRET }}"
        OAUTH_WELLKNOWN_URL: https://authentik.codewalker.dev/application/o/karakeep/.well-known/openid-configuration
        OAUTH_PROVIDER_NAME: authentik
        OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
        # Gemini API configuration
        OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
        OPENAI_API_KEY: "{{ .KARAKEEP_GEMINI_API_KEY }}"
  dataFrom:
    - extract:
        key: karakeep

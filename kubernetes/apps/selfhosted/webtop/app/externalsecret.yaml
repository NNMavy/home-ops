---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webtop
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: webtop-oidc-secret
    creationPolicy: Owner
    template:
      data:
        # Key names required by the Envoy Gateway SecurityPolicy OIDC refs
        client-id: "{{ .webtop_oauth_client_id }}"
        client-secret: "{{ .webtop_oauth_client_secret }}"
  dataFrom:
    - extract:
        key: webtop
      rewrite:
        - regexp:
            source: "(.*)"
            target: "webtop_$1"

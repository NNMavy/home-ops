---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: webtop
spec:
  # webtop has no authentication of its own: every request to the route must
  # carry an authentik session.
  oidc:
    clientIDRef:
      name: webtop-oidc-secret
    clientSecret:
      name: webtop-oidc-secret
    logoutPath: /oauth2/logout
    provider:
      issuer: https://authentik.codewalker.dev/application/o/webtop/
    redirectURL: https://webtop.codewalker.dev/oauth2/callback
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: webtop

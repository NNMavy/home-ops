---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: webtop
spec:
  chartRef:
    kind: OCIRepository
    name: webtop
  interval: 30m
  values:
    controllers:
      webtop:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            # Internet + home LAN (Cilium "world"), no in-cluster endpoints
            egress.policy.home.arpa/internet: "true"
          # s6-overlay (/init) must start as root to chown /config and drop to
          # abc (PUID/PGID); explicit so no default can force non-root.
          securityContext:
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/webtop
              tag: debian-xfce@sha256:8bb9f1ac0bcf64d6e0be56bcd65dbfa985ee8c2b09c16820ddae29d3e44aeaa3
            env:
              PGID: "2000"
              PUID: "2000"
              SELKIES_ALLOWED_ORIGINS: https://webtop.codewalker.dev
              # Defaults to true; no Docker-in-Docker here
              START_DOCKER: "false"
              TZ: Europe/Amsterdam
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                # Includes the 1Gi memory-backed /dev/shm
                memory: 4Gi
            # s6-overlay starts as root, chowns /config and drops to abc (PUID).
            # No privilege escalation, so sudo inside the desktop does not work.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - KILL
                  - SETGID
                  - SETUID
                drop:
                  - ALL

    networkpolicies:
      webtop:
        type: cilium
        controller: webtop
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
          - # Host-network agents (miroir, kguardian) probing from other nodes
            fromEntities:
              - remote-node
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP

    persistence:
      config:
        existingClaim: webtop
        globalMounts:
          - path: /config
      shm:
        type: emptyDir
        globalMounts:
          - path: /dev/shm
        medium: Memory
        sizeLimit: 1Gi

    route:
      app:
        hostnames: ["{{.Release.Name}}.codewalker.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http

    service:
      app:
        controller: webtop
        ports:
          http:
            port: 3000

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: searxng
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    networkpolicies:
      searxng:
        type: cilium
        egress:
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/name: searxng-valkey
            toPorts:
              - ports:
                  - port: "6379"
                    protocol: TCP
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: hermes
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP

    controllers:
      searxng:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"

        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 977
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 977
            runAsUser: 977

        containers:
          main:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2026.11.15-2d500cb6b
            env:
              SEARXNG_BASE_URL: https://search.codewalker.dev
              SEARXNG_URL: https://search.codewalker.dev
              SEARXNG_PORT: &port 8080
              SEARXNG_VALKEY_URL: valkey://searxng-valkey.selfhosted.svc.cluster.local:6379/0
            envFrom:
              - secretRef:
                  name: searxng-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /stats
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - SETGID
                  - SETUID
                  - DAC_OVERRIDE

    service:
      app:
        controller: searxng
        forceRename: "{{ .Release.Name }}-app"
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["search.codewalker.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{.Release.Name}}-app"
                port: *port

    persistence:
      config:
        type: configMap
        name: searxng-configmap
        globalMounts:
          - path: /etc/searxng/settings.yml
            subPath: settings.yml
            readOnly: true
          - path: /etc/searxng/limiter.toml
            subPath: limiter.toml
            readOnly: true
      tmpfs:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /etc/searxng
          - path: /tmp

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wyoming
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: 0.5.0
            env:
              WYOMING_URI: tcp://0.0.0.0:10300
              WYOMING_LOG_LEVEL: INFO
              WYOMING_LANGUAGES: en
              TTS_OPENAI_URL: http://fastkoko:8880/v1
              TTS_MODELS: "kokoro"
              TTS_STREAMING_MODELS: "kokoro"
              TTS_BACKEND: "KOKORO_FASTAPI"
              TTS_STREAMING_MIN_WORDS: "6"
              TTS_STREAMING_MAX_CHARS: "220"

    service:
      main:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "wyoming.nnhome.eu"
          io.cilium/lb-ipam-ips: "172.16.60.113"
        externalTrafficPolicy: Cluster
        ports:
          tcp:
            enabled: true
            port: 10300
            protocol: TCP

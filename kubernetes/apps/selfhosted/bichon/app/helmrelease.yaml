---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bichon
spec:
  chartRef:
    kind: OCIRepository
    name: bichon
  interval: 30m
  values:
    controllers:
      bichon:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: docker.io/rustmailer/bichon
              tag: 2.4.2
            env:
              BICHON_HTTP_PORT: &httpPort 15630
              BICHON_LOG_LEVEL: info
              BICHON_PUBLIC_URL: https://bichon.codewalker.dev
              BICHON_ROOT_DIR: /data
            envFrom:
              - secretRef:
                  name: bichon-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    networkpolicies:
      bichon:
        type: cilium
        controller: bichon
        egress:
          - # Mail provider APIs/OAuth (HTTPS) and IMAPS
            toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "993"
                    protocol: TCP
          - # IMAP via proton-bridge
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: proton-bridge
            toPorts:
              - ports:
                  - port: "143"
                    protocol: TCP
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "15630"
                    protocol: TCP
          - # Host-network agents (miroir, kguardian) probing from other nodes
            fromEntities:
              - remote-node
            toPorts:
              - ports:
                  - port: "15630"
                    protocol: TCP
    service:
      app:
        ports:
          http:
            port: *httpPort
    persistence:
      data:
        existingClaim: bichon
    route:
      app:
        hostnames:
          - bichon.codewalker.dev
        parentRefs:
          - name: envoy-internal
            namespace: network

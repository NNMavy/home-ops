---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zipline
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: zipline-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Application
        CORE_SECRET: "{{ .ZIPLINE_CORE_SECRET }}"
        DATABASE_URL: postgresql://{{ .ZIPLINE_POSTGRES_USER }}:{{ .ZIPLINE_POSTGRES_PASS }}@postgres-pgbouncer-rw.database.svc.cluster.local/zipline

        # Postgres Init
        INIT_POSTGRES_DBNAME: zipline
        INIT_POSTGRES_HOST: postgres-pgbouncer-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .ZIPLINE_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .ZIPLINE_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: zipline
    - extract:
        key: cloudnative-pg

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zipline
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: zipline
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
        replicas: 1
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7
            envFrom: &envFrom
              - secretRef:
                  name: zipline-secret
        containers:
          main:
            image:
              repository: ghcr.io/diced/zipline
              tag: 4.8.4@sha256:9fef0ad6ed0c176c737a8016abccf6f098d26f2f84f6931f39fcbb1d2004499d
            env: &env
              CORE_PORT: &port 4000
              DATASOURCE_TYPE: local
              DATASOURCE_LOCAL_DIRECTORY: /uploads
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

    networkpolicies:
      zipline:
        type: cilium
        controller: main
        egress:
          - # Postgres via pgbouncer (app and init-db)
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: database
                  cnpg.io/poolerName: postgres-pgbouncer-rw
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          - # authentik OIDC over HTTPS hairpin to envoy-external
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-external
            toPorts:
              - ports:
                  # Policy applies after Service translation: envoy's 443 listener
                  # is container port 10443.
                  - port: "10443"
                    protocol: TCP
                serverNames:
                  - authentik.codewalker.dev
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-external
            toPorts:
              - ports:
                  - port: "4000"
                    protocol: TCP
          - # Host-network agents (miroir, kguardian) probing from other nodes
            fromEntities:
              - remote-node
            toPorts:
              - ports:
                  - port: "4000"
                    protocol: TCP

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["{{ .Release.Name }}.codewalker.dev"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      uploads:
        enabled: true
        existingClaim: *app

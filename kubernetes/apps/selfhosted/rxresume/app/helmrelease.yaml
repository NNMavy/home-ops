---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rxresume
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4
            envFrom: &envFrom
              - secretRef:
                  name: rxresume-secret
        containers:
          main:
            image:
              repository: "ghcr.io/amruthpillai/reactive-resume"
              tag: "v4.5.6"
            env: &env
              PORT: 4000
              NODE_ENV: production
              PUBLIC_URL: "https://rxresume.nnhome.eu"
              STORAGE_URL: "https://minio.nnhome.eu:9000/cluster-0-rxresume"
              CHROME_TOKEN: chrome_token
              CHROME_URL: ws://localhost:3000
              ACCESS_TOKEN_SECRET: access_token_secret
              REFRESH_TOKEN_SECRET: refresh_token_secret
              MAIL_FROM: noreply@ninjanerd.eu
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
          chrome:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.55.2
              pullPolicy: IfNotPresent
            env:
              TIMEOUT: 10000
              CONCURRENT: 10
              TOKEN: chrome_token
              EXIT_ON_HEALTH_FAILURE: true
              PRE_REQUEST_HEALTH_CHECK: true
    service:
      app:
        ports:
          http:
            port: &port 4000

    route:
      app:
        hostnames: ["{{.Release.Name}}.nnhome.eu"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: "{{.Release.Name}}"
                port: *port
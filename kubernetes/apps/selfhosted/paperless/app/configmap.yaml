---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-configmap
data:
  # Configure application
  PAPERLESS_URL: https://paperless.nnhome.eu
  PAPERLESS_PORT: "8000"
  PAPERLESS_TIME_ZONE: "Europe/Amsterdam"
  PAPERLESS_WEBSERVER_WORKERS: "2"
  PAPERLESS_TASK_WORKERS: "2"
  PAPERLESS_TIKA_ENABLED: "1"
  PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
  PAPERLESS_TIKA_ENDPOINT: http://localhost:9998

  # Configure Remote User auth
  PAPERLESS_ENABLE_HTTP_REMOTE_USER: "true"
  PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: HTTP_X_AUTHENTIK_USERNAME

  # Configure folders
  PAPERLESS_CONSUMPTION_DIR: /library/consume
  PAPERLESS_DATA_DIR: /library/data
  PAPERLESS_EXPORT_DIR: /library/export
  PAPERLESS_MEDIA_ROOT: /library/media

  # Configure folder importer
  PAPERLESS_CONSUMER_POLLING: "60"
  PAPERLESS_CONSUMER_RECURSIVE: "true"
  PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"

  # Configure OCR
  PAPERLESS_OCR_LANGUAGES: nld eng
  PAPERLESS_OCR_LANGUAGE: nld

  # Configure BARCODE Scanner
  PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
  PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE: "true"

  # Configure redis integration
  PAPERLESS_REDIS: redis://paperless-redis.selfhosted.svc.cluster.local:6379

  # Configure user permissions
  USERMAP_UID: "568"
  USERMAP_GID: "568"

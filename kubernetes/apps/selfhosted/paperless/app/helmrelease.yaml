---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        type: statefulset
        replicas: 1

        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          labels:
            egress.policy.home.arpa/internet: "true"

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7
            envFrom:
              - secretRef:
                  name: paperless-secret

        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.5.0
            envFrom:
              - secretRef:
                  name: paperless-secret
              - configMapRef:
                  name: paperless-configmap
            resources:
              requests:
                cpu: 11m
                memory: 1000M
              limits:
                memory: 3500M
          gotenburg:
            image:
              repository: thecodingmachine/gotenberg
              tag: 8.30.1
            env:
              - {name: DISABLE_GOOGLE_CHROME, value: "1"}
          tika:
            image:
              repository: apache/tika
              tag: 3.3.3.0-full

    networkpolicies:
      paperless:
        type: cilium
        controller: main
        egress:
          - # Postgres via pgbouncer (app and init-db)
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: database
                  cnpg.io/poolerName: postgres-pgbouncer-rw
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          - # Valkey (redis)
            toEndpoints:
              - matchLabels:
                  app.kubernetes.io/name: paperless-valkey
            toPorts:
              - ports:
                  - port: "6379"
                    protocol: TCP
          - # Mail fetching over IMAP
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: proton-bridge
            toPorts:
              - ports:
                  - port: "143"
                    protocol: TCP
          - # authentik OIDC over HTTPS hairpin to envoy-external
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-external
            toPorts:
              - ports:
                  # Policy applies after Service translation: envoy's 443 listener
                  # is container port 10443.
                  - port: "10443"
                    protocol: TCP
                serverNames:
                  - authentik.codewalker.dev

    service:
      app:
        ports:
          http:
            port: 8000

    route:
      app:
        hostnames: ["paperless.codewalker.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      nas-consume:
        type: nfs
        server: holocron.codewalker.dev
        path: /mnt/largepool/paperless
        globalMounts:
          - path: /library

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spoolman
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: spoolman
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            envFrom:
              - secretRef:
                  name: spoolman-secret
        containers:
          app:
            image:
              repository: ghcr.io/donkie/spoolman
              tag: "0.26.1"
            env:
              SPOOLMAN_PORT: &port 8000
            envFrom:
              - secretRef:
                  name: spoolman-secret
            resources:
              requests:
                cpu: 14m
                memory: 128M
              limits:
                memory: 512M

      bambulab:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/rdiger-36/bambulab-ams-spoolman-filamentstatus
              tag: "1.2.1"
            env:
              SPOOLMAN_ENDPOINT: "http://spoolman-app:8000"
              MODE: "automatic"
            resources:
              requests:
                cpu: 14m
                memory: 128M
              limits:
                memory: 512M


    service:
      app:
        controller: main
        ports:
          http:
            port: *port
      bambulab:
        controller: bambulab
        ports:
          http:
            port: &bambuPort 4000

    route:
      app:
        hostnames: ["{{.Release.Name}}.codewalker.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{.Release.Name}}-app"
                port: *port
      bambulab:
        hostnames: ["bambulab-spoolman.codewalker.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{.Release.Name}}-bambulab"
                port: *bambuPort


    persistence:
      config:
        enabled: true
        existingClaim: spoolman
        advancedMounts:
          main:
            app:
              - path: /home/app/.local/share/spoolman
                readOnly: false
      bambulab-printers:
        type: secret
        name: bambulab-spoolman-secret
        advancedMounts:
          bambulab:
            app:
              - path: /app/printers/printers.json
                subPath: printers.json

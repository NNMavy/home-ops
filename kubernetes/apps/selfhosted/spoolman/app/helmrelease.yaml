---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spoolman
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: spoolman
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7
            envFrom:
              - secretRef:
                  name: spoolman-secret
        containers:
          app:
            image:
              repository: ghcr.io/donkie/spoolman
              tag: "0.27.1"
            env:
              SPOOLMAN_PORT: &port 8000
            envFrom:
              - secretRef:
                  name: spoolman-secret
            resources:
              requests:
                cpu: 14m
                memory: 128M
              limits:
                memory: 512M

    networkpolicies:
      spoolman:
        type: cilium
        controller: main
        egress:
          - # Postgres via pgbouncer (app and init-db)
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: database
                  cnpg.io/poolerName: postgres-pgbouncer-rw
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          - # SpoolmanDB filament database (GitHub)
            toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
          - fromEndpoints:
              - matchLabels:
                  app.kubernetes.io/controller: main
                  app.kubernetes.io/instance: haspelsync
                  app.kubernetes.io/name: haspelsync
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
          - # Host-network agents (miroir, kguardian) probing from other nodes
            fromEntities:
              - remote-node
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP

    service:
      app:
        controller: main
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["{{.Release.Name}}.codewalker.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{.Release.Name}}"
                port: *port

    persistence:
      config:
        enabled: true
        existingClaim: spoolman
        advancedMounts:
          main:
            app:
              - path: /home/app/.local/share/spoolman
                readOnly: false

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haspelsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: haspelsync-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        printers.json: "{{ .BAMBULAB_PRINTERS }}"
  dataFrom:
    - extract:
        key: bambulab-spoolman

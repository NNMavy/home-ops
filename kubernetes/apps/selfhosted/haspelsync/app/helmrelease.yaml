---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: haspelsync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: haspelsync
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/rdiger-36/haspelsync
              tag: "1.3.4"
            env:
              SPOOLMAN_ENDPOINT: "http://spoolman:8000"
              MODE: "automatic"
            resources:
              requests:
                cpu: 14m
                memory: 128M
              limits:
                memory: 512M


    service:
      app:
        controller: main
        ports:
          http:
            port: 4000

    route:
      app:
        hostnames: ["haspelsync.codewalker.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{.Release.Name}}-app"
                port: 4000

    persistence:
      config:
        enabled: true
        existingClaim: haspelsync
        advancedMounts:
          main:
            app:
              - path: /app/printers
                readOnly: false
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: haspelsync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: haspelsync
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
          # 1.4.0+ runs as the image's `node` user (1000); fsGroup hands the
          # PVC written by the root-running 1.3.x images over to that user.
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          app:
            image:
              repository: ghcr.io/rdiger-36/haspelsync
              tag: "1.4.0"
            env:
              SPOOLMAN_ENDPOINT: "http://spoolman:8000"
              MODE: "automatic"
            resources:
              requests:
                cpu: 14m
                memory: 128M
              limits:
                memory: 512M

    networkpolicies:
      haspelsync:
        type: cilium
        controller: main
        egress:
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/controller: main
                  app.kubernetes.io/instance: spoolman
                  app.kubernetes.io/name: spoolman
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
          - # Bambu printer MQTT (TLS) on the IoT VLAN (observed peer)
            toCIDR:
              - 172.16.15.146/32
            toPorts:
              - ports:
                  - port: "8883"
                    protocol: TCP
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "4000"
                    protocol: TCP
          - # Host-network agents (miroir, kguardian) probing from other nodes
            fromEntities:
              - remote-node
            toPorts:
              - ports:
                  - port: "4000"
                    protocol: TCP

    service:
      app:
        controller: main
        ports:
          http:
            port: 4000

    route:
      app:
        hostnames: ["haspelsync.codewalker.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{.Release.Name}}"
                port: 4000

    persistence:
      config:
        enabled: true
        existingClaim: haspelsync
        advancedMounts:
          main:
            app:
              - path: /app/printers
                readOnly: false
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pgadmin-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Application
        PGADMIN_DEFAULT_EMAIL: "{{ .ADMIN_MAIL }}"
        PGADMIN_DEFAULT_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        PGADMIN_CONFIG_MAIL_DEFAULT_SENDER: "'{{ .MAIL_USERNAME }}'"
        PGADMIN_CONFIG_SECURITY_EMAIL_SENDER: "'{{ .MAIL_USERNAME }}'"
        PGADMIN_CONFIG_MAIL_USERNAME: "'{{ .MAIL_USERNAME }}'"
        PGADMIN_CONFIG_MAIL_PASSWORD: "'{{ .MAIL_PASSWORD }}'"
  dataFrom:
    - extract:
        key: pgadmin

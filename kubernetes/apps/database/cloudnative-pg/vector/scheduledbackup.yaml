---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-vector
  namespace: database
spec:
  schedule: "@daily"
  immediate: true
  method: plugin
  backupOwnerReference: self
  cluster:
    name: postgres-vector
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

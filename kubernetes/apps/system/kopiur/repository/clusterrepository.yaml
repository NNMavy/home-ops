---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: holocron
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          path: /mnt/largepool/VolsyncKopia
          server: holocron.codewalker.dev
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-holocron-secret
      namespace: system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName

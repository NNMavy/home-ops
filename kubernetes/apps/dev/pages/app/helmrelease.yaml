---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pages
spec:
  chartRef:
    kind: OCIRepository
    name: pages
  interval: 30m
  values:
    controllers:
      pages:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: codeberg.org/git-pages/git-pages
              tag: 0.9.1@sha256:bbcdd603ef3d3dc66aa254479b255674e51286921c02e9f6569dc188f8756594
            env:
              ENVIRONMENT: "production"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3002
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: 3000
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        size: 5Gi
        storageClass: miroir-fast
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/data

    route:
      app:
        hostnames:
          - pages.codewalker.dev
        parentRefs:
          - name: envoy-internal
            namespace: network

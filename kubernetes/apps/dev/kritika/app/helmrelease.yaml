---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    deploymentAnnotations:
      secret.reloader.stakater.com/auto: "true"
    config:
      webUrl: https://kritika.codewalker.dev
      auth:
        admin:
          password:
            env: KRITIKA_AUTH_ADMIN_PASSWORD
      forgejo:
        home:
          host: git.codewalker.dev
          # The accounts this connection serves, not the bot that owns the
          # integration: kritika lists and polls repositories per account.
          accounts:
            - starforge
          audience:
          privateKey:
            env: KRITIKA_FORGEJO_PRIVATE_KEY
          # A second integration scoped to read:repository alone, so runner
          # pods never hold a writable token.
          runnerAudience: u:7:459ca156-aa5f-45af-bbe2-7efad98f59c3
          webhookSecret:
            env: KRITIKA_FORGEJO_WEBHOOK_SECRET
      embedding:
        model: openrouter/voyageai/voyage-code-4
        dims: 1024
      providers:
        chatgpt:
          type: chatgpt
        openrouter:
          type: openrouter
          apiKey:
            env: KRITIKA_OPENROUTER_API_KEY
        litellm:
          type: openai
          baseUrl: http://agentgateway.ai.svc.cluster.local:8080/v1
          apiKey:
            env: KRITIKA_LITELLM_API_KEY
      review:
        model: chatgpt/~luna-latest
        fallback: litellm/mistral/small-4
      trigger:
        exclude:
          - name: forks
            expr: pr.fork
      egress:
        allow:
          - "*"
        deny:
          - 10.244.0.0/16
    env:
      # A namespace-local scoped Agent Gateway key.
      KRITIKA_LITELLM_API_KEY:
        valueFrom:
          secretKeyRef:
            name: agentgateway-kritika
            key: key
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      # CNPG generates a secret for the database owner only, so the app and
      # runner roles get theirs from ExternalSecrets.
      app:
        existingSecret: kritika-postgres-approle
      owner:
        existingSecret: kritika-postgres-app
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      podTemplate:
        spec:
          runtimeClassName: gvisor
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
          path: /api/v1/meta
      hostnames:
        - kritika.codewalker.dev
      parentRefs:
        - name: envoy-internal
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
    networkPolicy:
      type: cilium
      postgres:
        namespace: database
        podSelector:
          cnpg.io/cluster: postgres16
      extraEgress:
        # A NetworkPolicy matches pods and their own ports, not a Service's.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ai
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: agentgateway
                  app.kubernetes.io/instance: agentgateway
          ports:
            - port: 8080
              protocol: TCP
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

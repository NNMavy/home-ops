---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-secret
    creationPolicy: Owner
  data:
    - secretKey: KRITIKA_AUTH_ADMIN_PASSWORD
      remoteRef:
        key: kritika
        property: password
    - secretKey: KRITIKA_FORGEJO_PRIVATE_KEY
      remoteRef:
        key: kritika
        property: forgejo_private_key
    - secretKey: KRITIKA_FORGEJO_WEBHOOK_SECRET
      remoteRef:
        key: kritika
        property: forgejo_webhook_secret
    - secretKey: KRITIKA_OPENROUTER_API_KEY
      remoteRef:
        key: kritika
        property: openrouter_api_key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-kritika
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-kritika
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: agentgateway
        property: kritika

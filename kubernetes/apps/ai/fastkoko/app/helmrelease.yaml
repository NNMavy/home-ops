---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fastkoko
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: fastkoko
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:

    controllers:
      fastkoko:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000

        initContainers:
          copy-voices:
            image:
              repository: &repository ghcr.io/remsky/kokoro-fastapi-cpu
              tag: &tag v0.10.0@sha256:f54c5960c2b9387f6349080a9944f8bc7e8cdb98a4ef9238cb0b0f9ff9795f44
            command: ["sh", "-c"]
            args: ["cp -avf /app/api/src/voices/v1_0/* /data/voices"]
        containers:
          app:
            image:
              repository: *repository
              tag: *tag
            env:
              ENABLE_INNO_TUNER: "true"
              ALLOW_LOCAL_VOICE_SAVING: "true"
              VOICES_DIR: "/data/voices"
            resources:
              requests:
                cpu: 5m
                memory: 2Gi
              limits:
                memory: 4Gi
    service:
      app:
        controller: fastkoko
        ports:
          http:
            port: &port 8880

    route:
      app:
        hostnames: ["{{.Release.Name}}.codewalker.dev"]
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 404"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{.Release.Name}}"
                port: *port

    persistence:
      data:
        existingClaim: fastkoko
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: agentgateway
        property: session_key
    - secretKey: CLIPROXYAPI_API_KEY
      remoteRef:
        key: agentgateway
        property: cliproxyapi
    - secretKey: CONTEXT7_API_KEY
      remoteRef:
        key: agentgateway
        property: context7
    - secretKey: HERMES_API_KEY
      remoteRef:
        key: agentgateway
        property: hermes
    - secretKey: KRITIKA_API_KEY
      remoteRef:
        key: agentgateway
        property: kritika
    - secretKey: KGUARDIAN_API_KEY
      remoteRef:
        key: agentgateway
        property: kguardian
    - secretKey: MISTRAL_API_KEY
      remoteRef:
        key: agentgateway
        property: mistral

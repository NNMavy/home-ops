---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.106.2@sha256:7294b90f868c5c38c99b83021c7ba46f9b439e95f8e32964c925c7d2563a03f7
  replicas: 1
  # Admin API access for DB-backed resources (LiteLLMVirtualKey). Models stay
  # file-backed because applyMode is left at its default.
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
  env:
    - name: CHATGPT_TOKEN_DIR
      value: /app/chatgpt_tokens
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://authentik.codewalker.dev/application/o/authorize
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: GENERIC_SCOPE
      value: openid profile email litellm_role
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://authentik.codewalker.dev/application/o/token
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: email
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://authentik.codewalker.dev/application/o/userinfo
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly.ai.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: PROXY_BASE_URL
      value: https://litellm.codewalker.dev
  envFrom:
    - secretRef:
        name: litellm
  generalSettings:
    # SSO (Authentik) is the only Admin UI login; the master key no longer works
    # as the UI password but still authenticates API calls.
    disable_env_credential_login: true
    health_check_endpoint: /v1/health
    store_model_in_db: false
    # Envoy gateway pods sit in the pod CIDR; trusting them lets the Admin UI
    # login throttle key on the real client address from X-Forwarded-For.
    trusted_proxy_ranges:
      - 10.244.0.0/16
  litellmSettings:
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
      supported_call_types:
        - embedding
        - aembedding
    drop_params: true
    failure_callback:
      - prometheus
    merge_reasoning_content_in_choices: true
    num_retries: 2
    prometheus_adapter: true
    request_timeout: 900
    retry_after: 5
    set_verbose: false
    success_callback:
      - prometheus
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  routerSettings:
    cooldown_time: 30
    enable_pre_call_checks: true
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
  service:
    type: ClusterIP
    port: 4000
  volumeMounts:
    - name: cache
      mountPath: /app/cache
    - name: litellm
      mountPath: /app/chatgpt_tokens
      subPath: chatgpt_tokens
  volumes:
    - name: cache
      emptyDir: {}
    - name: litellm
      persistentVolumeClaim:
        claimName: litellm
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: lumo-max
spec:
  modelName: proton/lumo-max
  params:
    model: openai/lumo-max
    apiBase: http://lumo-tamer:3003/v1
    apiKeyRef:
      name: litellm
      key: LUMO_TAMER_API_KEY
    dropParams: true
  info:
    maxInputTokens: 131072
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      supports_reasoning: true

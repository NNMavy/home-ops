---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm
    creationPolicy: Owner
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .litellm_master_key }}"
        LITELLM_SALT_KEY: "{{ .litellm_salt_key }}"
        LITELLM_DATABASE_URL: postgresql://{{ .litellm_postgres_user }}:{{ .litellm_postgres_pass }}@postgres-pgbouncer-rw.database.svc.cluster.local:5432/litellm
        GENERIC_CLIENT_ID: "{{ .litellm_client_id }}"
        GENERIC_CLIENT_SECRET: "{{ .litellm_client_secret }}"
        LUMO_TAMER_API_KEY: "{{ .lumo_tamer_api_key }}"
        OPENCODE_GO_API_KEY: "{{ .opencode_litellm_api_key }}"

        # Postgres Init
        INIT_POSTGRES_DBNAME: litellm
        INIT_POSTGRES_HOST: postgres-pgbouncer-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .litellm_postgres_user }}"
        INIT_POSTGRES_PASS: "{{ .litellm_postgres_pass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: litellm
      rewrite:
        - regexp:
            source: "(.*)"
            target: "litellm_$1"
    - extract:
        key: cloudnative-pg
    - extract:
        key: lumo-tamer
      rewrite:
        - regexp:
            source: "(.*)"
            target: "lumo_tamer_$1"
    - extract:
        key: opencode
      rewrite:
        - regexp:
            source: "(.*)"
            target: "opencode_$1"

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm
    creationPolicy: Owner
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .litellm_master_key }}"
        LUMO_TAMER_API_KEY: "{{ .lumo_tamer_api_key }}"
        OPENCODE_GO_API_KEY: "{{ .opencode_litellm_api_key }}"
  dataFrom:
    - extract:
        key: litellm
      rewrite:
        - regexp:
            source: "(.*)"
            target: "litellm_$1"
    - extract:
        key: lumo-tamer
      rewrite:
        - regexp:
            source: "(.*)"
            target: "lumo_tamer_$1"
    - extract:
        key: opencode
      rewrite:
        - regexp:
            source: "(.*)"
            target: "opencode_$1"

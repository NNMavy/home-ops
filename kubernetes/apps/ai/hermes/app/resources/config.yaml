---
# Managed infrastructure overlay; profile preferences remain on the PVC.
dashboard:
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://authentik.codewalker.dev/application/o/hermes/
      # offline_access makes authentik issue a refresh token; without it the session ends when the ID token expires.
      scopes: openid profile email offline_access
  public_url: https://hermes-dash.codewalker.dev

gateway:
  multiplex_profiles: true

security:
  redact_secrets: true

terminal:
  backend: local
  cwd: /opt/data/workspace
  env_passthrough:
    - SEARXNG_URL

telemetry:
  shared_metrics:
    enabled: false
    send: false

webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://hermes.codewalker.dev

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes
    creationPolicy: Owner
  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes
        property: api_server_key
    - secretKey: HERMES_DASHBOARD_OAUTH2_CLIENT_ID
      remoteRef:
        key: hermes
        property: oauth2_client_id
    - secretKey: HERMES_DASHBOARD_OAUTH2_CLIENT_SECRET
      remoteRef:
        key: hermes
        property: oauth2_client_secret
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-hermes
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: agentgateway
        property: hermes
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-forgejo
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-forgejo
    creationPolicy: Owner
  data:
    - secretKey: git.codewalker.dev
      remoteRef:
        key: forgejo
        property: lab_assistant_token

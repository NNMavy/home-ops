---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-redis
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-redis-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTHENTIK_REDIS__PASSWORD: "{{ .AUTHENTIK_REDIS_PASSWORD }}"
  dataFrom:
    - extract:
        key: Authentik

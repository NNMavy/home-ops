---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: immich-gpu

        strategy: Recreate
        containers:
          main:
            env:
              MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: "nllb-clip-large-siglip__mrl"
              MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: "nllb-clip-large-siglip__mrl"
              MACHINE_LEARNING_WORKER_TIMEOUT: 3600
              MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__RECOGNITION: buffalo_l
              MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__DETECTION: buffalo_l
              LOG_LEVEL: verbose
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: DB_HOSTNAME
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: DB_USERNAME
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: DB_PASSWORD
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: DB_DATABASE_NAME

    valkey:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 16Mi

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-photo-library

    server:
      controllers:
        main:
          pod:
            securityContext:
              supplementalGroups:
                - 44
                - 1000
          initContainers:
            init-db:
              image:
                repository: ghcr.io/home-operations/postgres-init
                tag: "18.6"
              envFrom:
                - secretRef:
                    name: immich-secret
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: "v3.1.0"
              resources:
                claims:
                  - name: gpu
                requests:
                  cpu: 50m
                  memory: 300Mi
                limits:
                  memory: 4Gi
              probes:
                liveness:
                  spec:
                    initialDelaySeconds: 60

                readiness:
                  spec:
                    initialDelaySeconds: 60

      route:
        app:
          hostnames: ["immich.codewalker.dev"]
          parentRefs:
            - name: envoy-internal
              namespace: network
          rules:
            - backendRefs:
                - name: "immich-server"
                  port: 2283

    machine-learning:
      persistence:
        cache:
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache
      controllers:
        main:
          pod:
            securityContext:
              supplementalGroups:
                - 44
                - 1000
          containers:
            main:
              securityContext:
                privileged: true
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: "v3.1.0-openvino"
              resources:
                claims:
                  - name: gpu
                requests:
                  cpu: 50m
                  memory: 6Gi
                limits:
                  memory: 24Gi
              probes:
                startup:
                  spec:
                    failureThreshold: 60
                    periodSeconds: 10
                liveness:
                  spec:
                    initialDelaySeconds: 120
                readiness:
                  spec:
                    initialDelaySeconds: 120

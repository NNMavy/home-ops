---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-photo-library
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  nfs:
    server: holocron.codewalker.dev
    path: /mnt/largepool/immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-photo-library
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Mi
  volumeName: immich-photo-library

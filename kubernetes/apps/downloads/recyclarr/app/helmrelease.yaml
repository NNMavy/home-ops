---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    apiKey:
      existingSecret: recyclarr-api-key
    configs:
      existingConfigMap: recyclarr-configmap
    deploymentAnnotations:
      secret.reloader.stakater.com/auto: "true"
    envFrom:
      - secretRef:
          name: recyclarr-secret
    image:
      tag: 9.0.0@sha256:4973d11b18b5ef09fb226f4161eecb16434ff7e6b43c56d50fceb52fb22c66c7
    persistence:
      # The v8 config claim from the kopiur component; v9 moves its state/
      # folder to the root on first start.
      state:
        existingClaim: recyclarr
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
    serviceMonitor:
      enabled: true

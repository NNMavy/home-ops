---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: recyclarr-api-key
spec:
  allowRepeat: true
  length: 64
  noUpper: false
  symbols: 0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-api-key
spec:
  # Only the CLI in the pod uses the key, so a new one after a rebuild is fine.
  refreshPolicy: CreatedOnce
  target:
    name: recyclarr-api-key
    creationPolicy: Owner
    template:
      data:
        api-key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: recyclarr-api-key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: recyclarr-secret
    template:
      data:
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: radarr
    - extract:
        key: sonarr

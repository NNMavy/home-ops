---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: observability
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: ntfy
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ntfy:
        containers:
          app:
            image:
              repository: docker.io/binwiederhier/ntfy
              tag: v2.27.0@sha256:f2419f405127afa868f10985c1a41449e673477cee1eb19994339a5ae8b592e7
            args: ["serve"]
            env:
              NTFY_BASE_URL: https://ntfy.codewalker.dev
              NTFY_LISTEN_HTTP: ":8080"
              NTFY_BEHIND_PROXY: "true"
              NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
              NTFY_CACHE_DURATION: 12h
              NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
              NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
              NTFY_AUTH_DEFAULT_ACCESS: deny-all
              NTFY_ENABLE_LOGIN: "true"
              # sqlite contention fix: default journal mode serializes writers, and
              # background jobs (delayed sends, token expiry) were locking the DBs
              # long enough that Alertmanager webhook posts got 5xx "database is
              # locked" (~25% of sends failing). WAL + busy_timeout lets readers and
              # writers coexist and makes brief lock waits invisible.
              NTFY_CACHE_STARTUP_QUERIES: |
                pragma journal_mode = WAL;
                pragma synchronous = normal;
                pragma temp_store = memory;
                pragma busy_timeout = 15000;
              NTFY_AUTH_STARTUP_QUERIES: |
                pragma journal_mode = WAL;
                pragma synchronous = normal;
                pragma busy_timeout = 15000;
              # In-cluster senders (alertmanager-ntfy bridge, gatus) connect with
              # their pod IP (no proxy in that path) — exempt the pod CIDR so an
              # alert flood can never rate-limit the alerting pipeline itself.
              NTFY_VISITOR_REQUEST_LIMIT_EXEMPT_HOSTS: 10.244.0.0/16
            envFrom:
              - secretRef:
                  name: ntfy-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: ntfy
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: "/v1/health"
        hostnames:
          - ntfy.codewalker.dev
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        type: persistentVolumeClaim
        size: 20Gi
        storageClass: miroir-slow
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /var/cache/ntfy
            subPath: cache
          - path: /var/lib/ntfy
            subPath: auth

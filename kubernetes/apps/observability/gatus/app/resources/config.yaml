---
alerting:
  ntfy:
    url: http://ntfy:8080
    topic: gatus
    token: ${NTFY_TOKEN}
    priority: 3
    default-alert:
      enabled: true
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 2

connectivity:
  checker:
    target: 194.242.2.2:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: ntfy

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: ntfy

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: ntfy

  - name: healthchecks.io
    group: heartbeat
    url: ${GATUS_HEARTBEAT_URL}
    interval: 5m
    client:
      dns-resolver: tcp://9.9.9.9:53
    conditions:
      - "[STATUS] == 200"

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/3441334
  link: https://github.com/NNMavy
  buttons:
    - name: Github
      link: https://github.com/NNMavy
    - name: Homelab
      link: https://github.com/NNMavy/home-ops

web:
  port: ${GATUS_WEB_PORT}

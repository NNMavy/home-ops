---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy:
      - "alertname"
      - "job"
    groupInterval: 10m
    groupWait: 1m
    receiver: telegram
    repeatInterval: 12h
    routes:
      - receiver: hyperdrive-heartbeat
        groupInterval: 2m
        groupWait: 0s
        repeatInterval: 2m30s
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # Channel-failure alerts must cross channels: a broken channel can't report
      # its own death (EEMUA alarm-system health). The FailedToSendAlerts alerts
      # carry an `integration` label, so split on it — webhook(=ntfy-bridge)
      # failures page via telegram, telegram failures notify via ntfy. This also
      # breaks the self-notify amplification loop in both directions. MUST precede
      # the critical->telegram route (first match wins).
      - receiver: telegram
        matchers:
          - name: alertname
            value: "Alertmanager(Cluster)?FailedToSendAlerts"
            matchType: =~
          - name: integration
            value: webhook
            matchType: =
      - receiver: ntfy
        matchers:
          - name: alertname
            value: "Alertmanager(Cluster)?FailedToSendAlerts"
            matchType: =~
      # Critical ->  ntfy (reliable, unlimited,
      # self-hosted failover).
      - receiver: ntfy
        matchers:
          - name: severity
            value: critical
            matchType: =
  inhibitRules:
    - equal:
        - "alertname"
        - "namespace"
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: blackhole
    - name: hyperdrive-heartbeat
      webhookConfigs:
        - httpConfig:
            bearerTokenSecret:
              name: alertmanager-secret
              key: hyperdrive_home_heartbeat_token
          urlSecret:
            name: alertmanager-secret
            key: hyperdrive_home_heartbeat_url
    - name: ntfy
      webhookConfigs:
        - sendResolved: true
          url: http://alertmanager-ntfy.observability.svc.cluster.local:8000/hook
    - name: telegram
      telegramConfigs:
        - botToken:
            name: alertmanager-secret
            key: telegram_gatus_token
          chatID: 234269172
          parseMode: HTML
          disableNotifications: false
          sendResolved: true
          message: '{{ template "telegram.default.message" . }}'
          httpConfig:
            followRedirects: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    creationPolicy: Owner
    template:
      data:
        telegram_gatus_id: "{{ .telegram_gatus_id }}"
        telegram_gatus_token: "{{ .telegram_gatus_token }}"
        hyperdrive_home_heartbeat_token: "{{ .gatus_hyperdrive_home_heartbeat_token }}"
        hyperdrive_home_heartbeat_url: "https://{{ .gatus_hyperdrive_gatus_hostname }}/api/v1/endpoints/home_heartbeat/external?success=true"
  dataFrom:
    - extract:
        key: telegram
      rewrite:
        - regexp:
            source: "(.*)"
            target: "telegram_$1"
    - extract:
        key: gatus
      rewrite:
        - regexp:
            source: "(.*)"
            target: "gatus_$1"

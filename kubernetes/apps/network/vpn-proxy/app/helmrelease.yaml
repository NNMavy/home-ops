---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: vpn-proxy
  interval: 30m
  values:
    controllers:
      vpn-proxy:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "multus-vpn",
                "namespace": "network",
                "ips": ["172.16.90.13/24"]
              }]
        containers:
          app:
            image:
              repository: ghcr.io/tarampampam/3proxy
              tag: 2.3.0
            env:
              PROXY_PORT: &proxyPort 8080
              SOCKS_PORT: &socksPort 1080
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 5m
                memory: 64M
              limits:
                memory: 64M

    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "proxy.codewalker.dev"
          io.cilium/lb-ipam-ips: "172.16.50.103"
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: *proxyPort
            protocol: TCP
          socks:
            port: *socksPort
            protocol: TCP

[env]
JUST_UNSTABLE = "1"
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = '{{config_root}}/kubeconfig'
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = '{{config_root}}/talosconfig'
_.file = [
  { path=".mise.mcp.env.toml"},
]

[settings]
pipx.uvx = true

[tools]
actionlint = "latest"
ansible = "latest"
ansible-core = "latest"
helmfile = "latest"
talosctl = "1.14.6"
uv = "latest"
yamlfmt = "latest"

"aqua:cilium/hubble" = "latest"
"aqua:mitsuhiko/minijinja" = "latest"
"github:home-operations/flate" = "0.8.0" # 0.7.x diff images misses HelmRelease-only changes; unpin after next release
"github:kguardian-dev/kguardian" = { version = "latest", version_prefix = "advisor/v", bin = "kubectl-kguardian" }
"github:perfectra1n/fjo" = "latest"

[hooks]
postinstall = "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml"


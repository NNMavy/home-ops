services:
  urbackup:
    container_name: urbackup
    environment:
      BROADCAST_INTERFACES: '""'
      NVIDIA_VISIBLE_DEVICES: void
      TZ: Etc/UTC
    group_add:
      - 568
    healthcheck:
      disable: True
    image: >-
      uroni/urbackup-server:2.5.x@sha256:e2fdc0d59071b0e9438ebb05fe163a839f767c4477851e87dcc3efa8df7ab299
    network_mode: host
    platform: linux/amd64
    privileged: False
    pull_policy: missing
    restart: 'no'
    stdin_open: False
    tty: False
    volumes:
      - bind:
          create_host_path: False
          propagation: rprivate
        read_only: False
        source: /mnt/largepool/backups
        target: /backups
        type: bind
      - bind:
          create_host_path: False
          propagation: rprivate
        read_only: False
        source: /mnt/vmdata-ssd/container-data/urbackup
        target: /var/urbackup
        type: bind

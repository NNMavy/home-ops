---
name: urbackup
networks:
  apps:
    name: apps
    external: true
services:
  urbackup:
    container_name: urbackup
    group_add:
      - 568
    healthcheck:
      disable: true
    image: >-
      uroni/urbackup-server:2.5.x@sha256:e2fdc0d59071b0e9438ebb05fe163a839f767c4477851e87dcc3efa8df7ab299
    labels:
      dexd.enabled: 'true'
      traefik.enable: 'true'
      traefik.http.routers.urbackup.rule: Host(`urbackup.codewalker.dev`)
      traefik.http.services.urbackup.loadbalancer.server.port: '55414'
    networks:
      - apps
    restart: unless-stopped
    volumes:
      - backups:/backups
      - data:/var/urbackup
volumes:
  backups:
    driver: local
    driver_opts:
      device: /mnt/largepool/backups
      o: bind
      type: none
  data:
    driver: local
    driver_opts:
      device: /mnt/vmdata-ssd/container-data/urbackup
      o: bind
      type: none

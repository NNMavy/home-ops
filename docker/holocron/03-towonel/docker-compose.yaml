services:
  towonel-agent:
    image: codeberg.org/towonel/towonel-agent:1.5.2
    network_mode: host
    restart: unless-stopped
    environment:
      RUST_LOG: info
      TOWONEL_INVITE_TOKEN: ${TOWONEL_INVITE_TOKEN}
      TOWONEL_AGENT_HEALTH_LISTEN_ADDR: 0.0.0.0:9090
      TOWONEL_AGENT_SERVICES: |
        [{"hostname":"*.codewalker.dev","origin":"127.0.0.1:443"}]

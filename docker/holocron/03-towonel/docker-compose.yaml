---
services:
  towonel-agent:
    image: codeberg.org/towonel/towonel-agent:1.6.0
    network_mode: host
    restart: unless-stopped
    environment:
      RUST_LOG: info
      TOWONEL_INVITE_TOKEN: ${TOWONEL_INVITE_TOKEN}
      TOWONEL_AGENT_HEALTH_LISTEN_ADDR: 0.0.0.0:9090
      TOWONEL_AGENT_SERVICES: |
        [{"hostname":"git.codewalker.dev","origin":"127.0.0.1:443","proxy_protocol":"none"},
        {"hostname":"downloader.codewalker.dev","origin":"127.0.0.1:443","proxy_protocol":"none"}]
